name: tests

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

jobs:
  pytest:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: |
          python -m pytest tests/ -q --tb=short 2>&1 | tee pytest_output.txt
          exit "${PIPESTATUS[0]}"

      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: |
          echo "::error::pytest fallito su ${{ matrix.os }} / Python ${{ matrix.python-version }}"
          grep -E "FAILED|ERROR|error:|assert" pytest_output.txt | tail -n 30 | sed 's/^/::error::/' || true
          echo "::error::--- ultime righe ---"
          tail -n 25 pytest_output.txt | sed 's/^/::error::/'

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest_output.txt

      - name: CLI smoke test (version)
        shell: bash
        run: python main.py --version
