name: macos-debug

# WORKFLOW TEMPORANEO di bisezione: capire quale subset fallisce su macOS.
# Da eliminare prima del merge.

on:
  push:
    branches:
      - "arena/**"

jobs:
  bisect:
    name: macos bisect
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "P0: sonda meccanismo pty"
        if: always()
        run: python tools/pty_probe.py

      - name: "D1bis: solo casi timeout (keys5/keys21) diag compatta"
        if: always()
        run: |
          python -m pytest tests/test_selector.py -q -k "keys5- or keys21-" --tb=line --junitxml=/tmp/d1.xml && rc=0 || rc=$?
          python tools/junit_annotate.py /tmp/d1.xml || true
          exit $rc

      - name: "D2: frecce CSI/SS3 + ESC/q"
        if: always()
        run: python -m pytest tests/test_selector.py -q -k "keys7- or keys8- or keys9- or keys10- or keys11- or keys12-"

      - name: "D3: input non valido + Tab/Backspace + redraw"
        if: always()
        run: python -m pytest tests/test_selector.py -q -k "keys13- or keys14- or keys17- or keys18- or redrawn"

      - name: "D4: Home/End"
        if: always()
        run: python -m pytest tests/test_selector.py -q -k "keys15- or keys16-"
