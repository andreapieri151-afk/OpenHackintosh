name: macos-debug

# WORKFLOW TEMPORANEO di bisezione: capire quale subset fallisce su macOS.
# Da eliminare prima del merge.

on:
  push:
    branches:
      - "arena/**"

jobs:
  bisect:
    name: macos bisect
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "A1: selector unit (no pty)"
        if: always()
        run: python -m pytest tests/test_selector.py -q -k "not pty"

      - name: "A2: selector pty e2e"
        if: always()
        run: python -m pytest tests/test_selector.py -q -k pty

      - name: "A3: pty e2e - solo digit semplici"
        if: always()
        run: python -m pytest tests/test_selector.py -q -k "pty and (3 or 9) and a3 or a9"
