name: Build and Release OpenHackintosh

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload assets to (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Build macOS app ZIP
      run: |
        echo "Building OpenHackintosh ZIP..."
        TAG=${{ github.event.inputs.tag || github.ref_name }}
        echo "Tag: $TAG"
        zip -r OpenHackintosh-${TAG}-macOS.zip . -x "*.git*" "*__pycache__*" "*.DS_Store*" "downloads/*" "*.pyc" "releases/*" ".github/*" -q
        ls -lh OpenHackintosh-*.zip
        
    - name: Build sample EFI structure
      run: |
        echo "Building sample EFI structure..."
        TAG=${{ github.event.inputs.tag || github.ref_name }}
        python3 -c "
import sys
from pathlib import Path
sys.path.insert(0, 'src')
from efi_builder.builder import EFIBuilder
from efi_builder.smbios import generate_smbios
import shutil

tmp = Path('/tmp/sample_build')
if tmp.exists():
    shutil.rmtree(tmp)
tmp.mkdir()

builder = EFIBuilder(tmp)
builder.create_structure()

kexts_dir = tmp / 'EFI' / 'OC' / 'Kexts'
for kext_name in ['Lilu.kext', 'VirtualSMC.kext', 'WhateverGreen.kext', 'AppleALC.kext', 'RealtekRTL8111.kext', 'SMCProcessor.kext', 'SMCSuperIO.kext', 'NVMeFix.kext']:
    (kexts_dir / kext_name / 'Contents').mkdir(parents=True, exist_ok=True)
    (kexts_dir / kext_name / 'Contents' / 'Info.plist').write_text('''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
<plist><dict><key>CFBundleIdentifier</key><string>as.vit9696.test</string></dict></plist>''')
    (kexts_dir / kext_name / 'Contents' / 'MacOS').mkdir(parents=True, exist_ok=True)
    (kexts_dir / kext_name / 'Contents' / 'MacOS' / kext_name.replace('.kext','')).write_bytes(b'\\x00' * 1024 + b'SAMPLE')

drivers_dir = tmp / 'EFI' / 'OC' / 'Drivers'
for drv in ['HfsPlus.efi', 'OpenRuntime.efi', 'OpenCanopy.efi', 'ResetNvramEntry.efi']:
    (drivers_dir / drv).write_bytes(b'\\x00' * 2048 + drv.encode())

acpi_dir = tmp / 'EFI' / 'OC' / 'ACPI'
for ssdt in ['SSDT-PLUG.aml', 'SSDT-EC-USBX.aml', 'SSDT-AWAC.aml', 'SSDT-PMC.aml']:
    (acpi_dir / ssdt).write_bytes(b'\\x00' * 500 + ssdt.encode())

(tmp / 'EFI' / 'OC' / 'OpenCore.efi').write_bytes(b'\\x00' * 4096 + b'OpenCore')
(tmp / 'EFI' / 'BOOT' / 'BOOTx64.efi').write_bytes(b'\\x00' * 2048 + b'BOOTx64')
(tmp / 'EFI' / 'OC' / 'Tools').mkdir(exist_ok=True)

smbios = generate_smbios('iMac18,1')
builder.generate_config_plist('Q556/2', 'iMac18,1', 11, 'Ventura 13.x', smbios)
builder.create_readme('Q556/2', 'Ventura 13.x', 'iMac18,1')
zip_path = builder.create_zip()
print(f'Sample EFI ZIP: {zip_path}')
"
        TAG=${{ github.event.inputs.tag || github.ref_name }}
        cp /tmp/sample_build/EFI_Q5562.zip ./EFI-Q5562-SAMPLE-STRUCTURE-${TAG}.zip
        ls -lh *.zip
        
    - name: Create macOS launcher
      run: |
        cat > OpenHackintosh.command << 'EOF'
        #!/bin/bash
        cd "$(dirname "$0")"
        echo "OpenHackintosh - EFI vere, non finte"
        echo "Avvio GUI..."
        python3 -m pip install -r requirements.txt --break-system-packages -q 2>/dev/null || pip install -r requirements.txt -q
        python3 main.py
        EOF
        chmod +x OpenHackintosh.command
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        files: |
          OpenHackintosh-*.zip
          EFI-Q5562-SAMPLE-STRUCTURE-*.zip
          OpenHackintosh.command
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
